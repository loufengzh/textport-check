name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit-and-wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - name: Install built wheel and smoke outside checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/textport-smoke"
          if [ "$RUNNER_OS" = Windows ]; then
            py="$RUNNER_TEMP/textport-smoke/Scripts/python.exe"
          else
            py="$RUNNER_TEMP/textport-smoke/bin/python"
          fi
          "$py" -m pip install --no-index --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$py" -m textport_check --version
  native-consumers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tests/runtime_fixtures.py
